<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Link unavailable</title>
  <style>
  @font-face { font-family: 'Nordwand Mono'; src: url('/static/fonts/NordwandMono-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: 'Nordwand Mono'; src: url('/static/fonts/NordwandMono-Italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: block; }
  @font-face { font-family: 'Nordwand Mono'; src: url('/static/fonts/NordwandMono-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: block; }
  @font-face { font-family: 'Nordwand Mono'; src: url('/static/fonts/NordwandMono-SemiBold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: block; }
  @font-face { font-family: 'Nordwand Mono'; src: url('/static/fonts/NordwandMono-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: block; }
    /* Site palette + typography (matches stroketracker base.html, dark default) */
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#0e0e12; color:#ffffff; font-weight:300; line-height:1.6;
      font-family:'Nordwand Mono','Courier New',monospace; }
    .card { max-width:440px; margin:24px; padding:28px 30px; background:#16161d;
      border:1px solid #2a2a38; border-radius:12px; text-align:center; }
    h1 { font-family:'Nordwand Mono','Courier New',monospace;
      font-size:1.3rem; font-weight:600; margin:0 0 10px; }
    p { color:rgb(202, 196, 223); font-size:0.95rem; margin:0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>This link is no longer available</h1>
    <p>It may have expired or been turned off by the patient. If you still need
       access to this record, please ask them to send a fresh link.</p>
  </div>
</body>
</html>
